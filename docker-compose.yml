services:
  theme-studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4444:80"
    depends_on:
      mock-server:
        condition: service_healthy

  mock-server:
    build:
      context: ./MockServer
      dockerfile: Dockerfile
    ports:
      - "5150:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
